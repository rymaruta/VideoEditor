name: Windows release gates

on:
  pull_request:
  push:
    branches:
      - claude/video-editing-app-ivwvqp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Electron build
        run: npx electron-vite build

  # 持ち主の PC で試す版。展開して起動するフォルダ(VideoEditor-windows-<コミット>)と、
  # インストーラ(VideoEditor-windows-installer-<コミット>)を Actions の「Artifacts」に置く。
  # 配布用ではないので販売者などの検査は掛けない(フォルダは --dir、インストーラは VE_PERSONAL_BUILD=1)
  package:
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          npx electron-vite build
          npm run licenses

      - name: Package (unpacked, x64)
        run: npx electron-builder --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload (folder)
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-${{ github.sha }}
          path: dist/win-unpacked
          retention-days: 14

      # 持ち主の PC で試すインストーラ(署名なし・配布しない)。スタートメニュー・デスクトップのショートカットと
      # 「設定 > アプリ」からのアンインストールが付く
      - name: Installer (personal, unsigned)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VE_PERSONAL_BUILD: '1'

      - name: Upload (installer)
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-installer-${{ github.sha }}
          path: dist/*-personal-setup.exe
          retention-days: 14
