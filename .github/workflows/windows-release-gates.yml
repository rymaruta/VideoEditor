name: Windows release gates

on:
  pull_request:
  push:
    branches:
      - claude/video-editing-app-ivwvqp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Electron build
        run: npx electron-vite build
