name: Windows release gates

on:
  pull_request:
  push:
    branches:
      - claude/video-editing-app-ivwvqp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Electron build
        run: npx electron-vite build

  # 持ち主の PC で試す版(インストーラではなく、展開してそのまま起動するフォルダ)。
  # 配布用ではないので release-check は通さない(electron-builder --dir は beforePack の検査に掛からない)。
  # Actions の実行結果の「Artifacts」から VideoEditor-windows-<コミット> をダウンロードし、展開して VideoEditor.exe を起動する
  package:
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          npx electron-vite build
          npm run licenses

      - name: Package (unpacked, x64)
        run: npx electron-builder --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-${{ github.sha }}
          path: dist/win-unpacked
          retention-days: 14
