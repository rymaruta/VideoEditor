name: Windows release gates

on:
  pull_request:
  push:
    branches:
      - claude/video-editing-app-ivwvqp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test

      - name: Electron build
        run: npx electron-vite build

  # 持ち主の PC で試す版。展開して起動するフォルダ(VideoEditor-windows-<コミット>)と、
  # インストーラ(VideoEditor-windows-installer-<コミット>)を Actions の「Artifacts」に置く。
  # 配布用ではないので販売者などの検査は掛けない(フォルダは --dir、インストーラは VE_PERSONAL_BUILD=1)。
  # どちらも VE_PERSONAL_BUILD=1 で作り、自動更新をしない(正式版に置き換わらない。docs/RELEASE.md)。
  # 正式版は .github/workflows/release.yml(v* のタグ)で作る。
  # フォルダは作った後に起動して確かめる(煙の試験。scripts/smoke-electron.mjs)
  package:
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          npx electron-vite build
          npm run licenses

      # コード署名: リポジトリの Secrets に WIN_CSC_LINK(.pfx を base64 にしたもの)と WIN_CSC_KEY_PASSWORD を
      # 入れると署名する。無ければ署名せずに作る(docs/WINDOWS_SIGNING.md)
      - name: Package (unpacked, x64)
        run: npx electron-builder --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          VE_PERSONAL_BUILD: '1'

      # 作った VideoEditor.exe を Playwright(playwright-core の _electron)で起動し、最初の窓に「書き出す」ボタンが
      # 描かれること・ページのエラーが無いこと・製品の部品(ffmpeg・ffprobe・onnxruntime・DirectML)があること・
      # 環境チェック(ffmpeg・onnxruntime・node-llama-cpp を読めるか)と ffprobe(probeMedia)が通ることを確かめる。
      # 駄目ならジョブを落とす(配布物を小さくする files の絞り込みで壊れていないか)
      - name: Smoke test (launch the packaged app)
        run: node scripts/smoke-electron.mjs --exe dist/win-unpacked/VideoEditor.exe --build personal --out smoke

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-smoke-${{ github.sha }}
          path: smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload (folder)
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-${{ github.sha }}
          path: dist/win-unpacked
          retention-days: 14

      # 持ち主の PC で試すインストーラ(証明書が Secrets にあれば署名する・配布しない)。スタートメニュー・デスクトップのショートカットと
      # 「設定 > アプリ」からのアンインストールが付く
      - name: Installer (personal, unsigned)
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          VE_PERSONAL_BUILD: '1'

      - name: Upload (installer)
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-windows-installer-${{ github.sha }}
          path: dist/*-personal-setup.exe
          retention-days: 14
